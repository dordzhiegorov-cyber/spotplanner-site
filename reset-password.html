<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Reset your password — Spotplanner</title>
<link rel="stylesheet" href="style.css">
<style>
  form { display: grid; gap: 12px; max-width: 420px; }
  label { display: grid; gap: 6px; font-weight: 600; }
  input { font: inherit; padding: 12px 14px; border: 1px solid #cfd6d3; border-radius: 12px; }
  button { font: inherit; font-weight: 600; padding: 12px 18px; border: 0; border-radius: 12px; background: #0b8583; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: default; }
  .note { padding: 12px 14px; border-radius: 12px; background: #eef5f3; }
  .error { background: #fdecec; color: #8a2a1f; }
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><span class="badge"></span>Spotplanner</a>
  <nav><a href="/support.html">Support</a><a href="/privacy.html">Privacy</a></nav>
</header>
<main>
  <h1>Reset your password</h1>
  <p class="muted">Choose a new password for your Spotplanner account. The link from the email works once and expires after a short while.</p>

  <form id="form" hidden>
    <label>New password
      <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
    </label>
    <label>Repeat it
      <input id="repeat" type="password" autocomplete="new-password" minlength="8" required>
    </label>
    <button id="submit" type="submit">Save the new password</button>
  </form>
  <p id="message" class="note" hidden></p>
  <p id="done" class="note" hidden>Done. Open the Spotplanner app and sign in with your new password.</p>
</main>
<script>
  // The API (docs/decisions/0013); the token comes in the link's hash so it never reaches a server log.
  var API = "https://api.spotplanner.eu";
  var token = new URLSearchParams(location.hash.replace(/^#/, "")).get("token") || "";
  var form = document.getElementById("form"), msg = document.getElementById("message"), done = document.getElementById("done");
  function say(text, isError) { msg.textContent = text; msg.hidden = false; msg.className = "note" + (isError ? " error" : ""); }
  if (!token) {
    say("This link is missing its code. Open the latest reset email and tap its link again, or request a new one in the app.", true);
  } else {
    form.hidden = false;
  }
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    var p = document.getElementById("password").value, r = document.getElementById("repeat").value;
    if (p !== r) { say("The two passwords differ.", true); return; }
    if (p.length < 8) { say("Use at least 8 characters.", true); return; }
    var btn = document.getElementById("submit");
    btn.disabled = true; msg.hidden = true;
    try {
      var res = await fetch(API + "/api/auth/password-reset/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: token, password: p }) });
      if (res.ok) { form.hidden = true; done.hidden = false; history.replaceState(null, "", location.pathname); return; }
      if (res.status === 400 || res.status === 401 || res.status === 404 || res.status === 410) {
        say("This link is no longer valid. Request a new reset email in the app.", true);
      } else if (res.status === 429) {
        say("Too many tries. Wait a minute and try again.", true);
      } else {
        say("Something went wrong (" + res.status + "). Try again in a moment.", true);
      }
    } catch (err) {
      say("No connection. Check your internet and try again.", true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
